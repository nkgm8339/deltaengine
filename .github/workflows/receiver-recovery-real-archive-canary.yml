name: Receiver recovery real archive canary

on:
  workflow_dispatch:
  push:
    branches:
      - codex/recovery-validation-20260813
    paths:
      - .github/workflows/receiver-recovery-real-archive-canary.yml

permissions:
  contents: read

jobs:
  real-archive-canary:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Delta_Engine_Pro4web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Delta_Engine_Pro4web/requirements.txt
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and verify a real Binance daily archive
        run: >-
          python tools/receiver_recovery_archive_canary.py
          --date 2026-08-11
          --output "${{ runner.temp }}/receiver-recovery-real-canary"
      - name: Upload real archive canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: receiver-recovery-real-archive-canary
          path: ${{ runner.temp }}/receiver-recovery-real-canary
          if-no-files-found: error
          retention-days: 14
