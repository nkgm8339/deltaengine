name: CPU bounded-book validation

on:
  push:
    branches:
      - codex/cpu-validation-20260812

permissions:
  contents: read

jobs:
  targeted-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Delta_Engine_Pro4web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Delta_Engine_Pro4web/requirements.txt
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Run only the four CPU-related test files
        run: >-
          python -m pytest -q
          tests/orderflow/test_orderbook.py
          tests/strategy_engine/test_snapshot_producer.py
          tests/orderflow/test_stage2b_dom_detectors.py
          tests/webapp/test_book_update.py
      - name: Compare legacy and bounded selection
        env:
          PYTHONPATH: .
          BASELINE_ORDERBOOK_PATH: /tmp/baseline_orderbook.py
        run: |
          git show b4468fadc0052abe01d906146f0e7a0a7f9d9f82:Delta_Engine_Pro4web/src/orderflow/orderbook.py > /tmp/baseline_orderbook.py
          python tools/cpu_orderbook_benchmark.py
      - name: Upload benchmark and profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-orderbook-validation
          path: |
            Delta_Engine_Pro4web/cpu_orderbook_benchmark.json
            Delta_Engine_Pro4web/cpu_orderbook_profile.txt
            Delta_Engine_Pro4web/cpu_orderbook_legacy.prof
            Delta_Engine_Pro4web/cpu_orderbook_bounded.prof
          if-no-files-found: warn
          retention-days: 14
