version: "3.9"
services:
  deltaengine_clone:
    build: .
    # Docker Desktop's embedded resolver intermittently returned EAI_AGAIN/
    # name-not-known for Binance, causing reconnect storms and stale heartbeat.
    # Use explicit resolvers so the live upstream path does not depend on the
    # host-side embedded DNS cache.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "18080:8080"
      # MT5 Adapter (SIGNAL/HEARTBEAT)。ホストの loopback のみに公開（LAN 非公開）。
      # MT5 は同一 Windows ホスト上の 127.0.0.1:15555 へ接続する。
      - "127.0.0.1:15555:5555"
    volumes:
      - ./data_05M:/app/data_05M
      - ./config:/app/config
      - ./webapp/static:/app/webapp/static
      - type: bind
        source: ${APPDATA}/MetaQuotes/Terminal/Common/Files/DeltaEngine_HFM_quotes_utf8.jsonl
        target: /app/data_05M/hfm/DeltaEngine_HFM_quotes_utf8.jsonl
        read_only: true
      # バージョン単一情報源(webapp/version.py が /app/CHANGELOG.md を読む)
      - ../ArchitectureRepository/00_Master/CHANGELOG.md:/app/CHANGELOG.md:ro
    environment:
      - PYTHONUNBUFFERED=1
      - HFM_QUOTE_FILE=/app/data_05M/hfm/DeltaEngine_HFM_quotes_utf8.jsonl
      - HOOK_OBSERVER_CONFIG=/app/config/hook_observer.yaml
      # Official Binance Spot BTC/USDT last trade. Display-only reference;
      # never enters the USD-M Order Flow / Hook / Strategy pipeline.
      - BINANCE_SPOT_REFERENCE_ENABLED=true
      - BINANCE_SPOT_STREAM_URL=wss://stream.binance.com:9443/ws/btcusdt@trade
      # PD4 compatibility boundary: persistent writer remains disabled.
      # 旧persistent writer(UI投影系)は無効。値もfalseで一致(R7)。
      - PERSISTENT_DEPTH_HISTORY_ENABLED=false
      - PERSISTENT_DEPTH_HISTORY_ROOT=/app/data_05M/depth_history
      # ADR-011 raw depth history(取得層タップ)。有効化はP1-2で判断。
      - DEPTH_HISTORY_ENABLED=false
      - DEPTH_HISTORY_ROOT=/app/data_05M/depth_history_raw
    restart: unless-stopped
